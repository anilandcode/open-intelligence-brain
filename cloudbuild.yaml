# Cloud Build config for the Digital Brain image.
#
# The image is built without any owner token. Vite inlines every `VITE_*`
# variable into the shipped JavaScript, so a token passed here would be readable
# by anyone who loads the page. The owner token now exists in exactly one place:
# the runtime environment of the deployed service. See scripts/deploy-cloud-run.sh.
#
# Non-secret frontend flags only:
#   _SITE_URL — Vercel marketing origin baked as VITE_SITE_URL (console back-link)
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - VITE_SHOW_LANDING=false
      - --build-arg
      - VITE_SITE_URL=${_SITE_URL}
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
substitutions:
  _IMAGE: ""
  _SITE_URL: "https://open-brain-bice.vercel.app"
options:
  machineType: E2_HIGHCPU_8
timeout: 1800s
