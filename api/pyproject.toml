[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-intelligence-brain"
version = "0.1.0"
description = "A local-first governed intelligence workspace"
readme = "README-placeholder.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "psycopg[binary]>=3.2,<4",
  "mcp>=2,<3",
]

[project.scripts]
open-brain-mcp = "brain.mcp_server:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E402", "E501"]
